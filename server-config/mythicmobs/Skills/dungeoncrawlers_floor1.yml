# Floor I room roster, adapted to CaveCrawlers stats. No boss or Watcher changes.
# Roster: https://hypixelskyblock.minecraft.wiki/w/Catacombs_Mobs
# Crypt Undead, Prince and Crypt Guard use room markers in place of Hypixel tomb triggers.
DCF1_BoneOnce:
  Conditions:
  - targetwithin{d=24} true
  - variableisset{var=caster.dcf1_bone} false
  TargetConditions:
  - lineofsight true
  Skills:
  - setvariable{var=caster.dcf1_bone;type=BOOLEAN;value=true} @self
  - sound{s=entity.skeleton.shoot;v=0.8;p=0.6} @self
  - delay 12
  - projectile{bulletType=ITEM;material=BONE;onHit=DCF1_BoneHit;v=18;i=1;hR=0.5;vR=0.8;mr=24;syo=1.4;tyo=1;hitPlayers=true;hitNonPlayers=false;stopAtBlock=true;stopAtEntity=true}
DCF1_BoneHit:
  TargetConditions:
  - isPlayer true
  Skills:
  - damage{a=1125000}
DCF1_Skull:
  Conditions:
  - targetwithin{d=28} true
  TargetConditions:
  - lineofsight true
  Skills:
  - sound{s=entity.wither.shoot;v=0.5;p=1.2} @self
  - delay 15
  - projectile{bulletType=ITEM;material=WITHER_SKELETON_SKULL;onTick=DCF1_SkullTrail;onHit=DCF1_SkullHit;v=12;i=2;hR=0.6;vR=0.8;mr=28;syo=1.5;tyo=1;hitPlayers=true;hitNonPlayers=false;stopAtBlock=true;stopAtEntity=true}
DCF1_SkullTrail:
  Skills:
  - particles{p=SMOKE;a=2;hS=0.1;vS=0.1} @origin
DCF1_SkullHit:
  TargetConditions:
  - isPlayer true
  Skills:
  - damage{a=937500}
