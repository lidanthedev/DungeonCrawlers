name: DungeonCrawlers
version: '${version}'
main: me.lidan.dungeonCrawlers.DungeonCrawlers
api-version: '1.21'
authors: [ LidanTheDev ]
description: Dungeon gameplay addon for CaveCrawlers
depend: [CaveCrawlers, FastAsyncWorldEdit, MythicMobs, Vault, ProtocolLib]
softdepend: [Parties, Essentials, PlaceholderAPI]
libraries:
  - io.github.revxrsal:lamp.common:4.0.0-rc.17
  - io.github.revxrsal:lamp.brigadier:4.0.0-rc.17
  - io.github.revxrsal:lamp.bukkit:4.0.0-rc.17
permissions:
  dungeoncrawlers.use:
    default: true
  dungeoncrawlers.admin:
    default: op
    children:
      dungeoncrawlers.admin.compatibility: true
      dungeoncrawlers.admin.config: true
      dungeoncrawlers.admin.reload: true
      dungeoncrawlers.admin.simulate: true
      dungeoncrawlers.admin.diagnostics: true
      dungeoncrawlers.admin.authoring: true
      dungeoncrawlers.admin.generation: true
      dungeoncrawlers.admin.debug: true
  dungeoncrawlers.admin.debug:
    default: op
  dungeoncrawlers.admin.compatibility:
    default: op
  dungeoncrawlers.admin.config:
    default: op
  dungeoncrawlers.admin.reload:
    default: op
  dungeoncrawlers.admin.simulate:
    default: op
  dungeoncrawlers.admin.diagnostics:
    default: op
  dungeoncrawlers.admin.authoring:
    default: op
  dungeoncrawlers.admin.generation:
    default: op
