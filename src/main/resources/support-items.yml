# Native CaveCrawlers definitions are installed once and preserve later admin edits.
# Right click from the main hand. Effects reach nearby living players within 16 blocks
# (8 for Mending Wand). Effects have half strength outside dungeons. Any class may use these items.
DC_AEGIS_STANDARD:
  name: Aegis Standard
  material: WHITE_BANNER
  description: "A tank's rallying standard. Right click to shelter nearby players."
  stats:
    HEALTH: 100
    DEFENSE: 75
  ability: dc_aegis_standard
  ability-name: Rallying Aegis
  ability-description: "Heal nearby players for 10% of max health and grant +35% Defense for 10 seconds."
  cooldown-seconds: 25
DC_BASTION_HORN:
  name: Bastion Horn
  material: GOAT_HORN
  description: "Sound the call to hold the line. Right click to protect nearby players."
  stats:
    HEALTH: 150
    DEFENSE: 100
  ability: dc_bastion_horn
  ability-name: Bastion's Call
  ability-description: "Heal nearby players for 5% of max health and reduce incoming damage by 25% for 10 seconds."
  cooldown-seconds: 35
DC_RENEWAL_STAFF:
