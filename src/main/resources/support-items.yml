    INTELLIGENCE: 100
  ability: dc_renewal_staff
  ability-name: Wellspring
  ability-description: "Heal nearby players for 30% of max health and restore 5% each second for 10 seconds. Healing scales with your Healer bonus."
  cooldown-seconds: 25
DC_DAWNLIGHT_TOME:
