schema-version: 3

# Leave blank to use the first loaded world's spawn when Essentials spawn is unavailable.
fallback-spawn-world: ""

# Number of successful-reload config snapshots to retain. Migration backups are kept separately.
backups:
  retention-count: 10

# UUID of a disposable, funded account used only by the explicit economy probe.
compatibility:
  economy-test-account-uuid: ""

# Whether Emerald player-spawn markers are replaced with air or retained in authored templates.
authoring:
  emerald-marker-policy: replace

# Dedicated void-world and ten-thousand-block slot grid used by asynchronous generation.
generation:
  world: dungeon_instances
  capacity: 4
  slot-spacing: 10000
  slot-margin: 500
  base-y: 64
